[build]
  publish = "."

# Keep the lead-gen system off the public site
[[redirects]]
  from = "/client-acquisition/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
